name: Publish plugin zip

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm validate

      # The archive holds the contents of plugin/, so plugin.json sits at its root.
      - name: Build the plugin archive
        run: |
          cd plugin
          zip -qr /tmp/builder-plugin.zip . -x '.DS_Store'
          unzip -l /tmp/builder-plugin.zip

      - name: Publish the rolling release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view claude-org-plugin >/dev/null 2>&1; then
            gh release create claude-org-plugin \
              --title "Claude organization plugin bundle" \
              --notes "Rolling zip of plugin/ built from the current main. Upload builder-plugin.zip in Claude organization plugin settings."
          fi
          gh release upload claude-org-plugin /tmp/builder-plugin.zip --clobber
