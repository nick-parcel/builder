name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the tag commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit $GITHUB_SHA is not contained in origin/main"
            exit 1
          fi

      - name: Verify the tag matches the plugin version
        run: |
          version=$(node -p "require('./plugin/.claude-plugin/plugin.json').version")
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version ${version}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate repository
        run: pnpm validate

      - name: Claude plugin validate (if available)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate --strict ./plugin
            claude plugin validate --strict .
          else
            echo "claude CLI not installed on this runner, relying on pnpm validate and pinned schema tests"
          fi

      - name: Plugin content guard
        run: |
          if [ -d plugin ]; then
            symlinks=$(find plugin -type l)
            if [ -n "$symlinks" ]; then
              echo "Symlinks are not allowed under plugin/:"
              echo "$symlinks"
              exit 1
            fi
            executables=$(find plugin -type f -perm -u+x)
            if [ -n "$executables" ]; then
              echo "Executable files are not allowed under plugin/:"
              echo "$executables"
              exit 1
            fi
          else
            echo "plugin/ does not exist yet, skipping"
          fi

      - name: Build and verify release artifacts
        run: |
          export SOURCE_COMMIT="$GITHUB_SHA"
          export RELEASE_TAG="$GITHUB_REF_NAME"
          export PLUGIN_VERSION="${GITHUB_REF_NAME#v}"
          pnpm check:generated
          pnpm build:spec
          sha256sum dist/spec/catalog.json dist/spec/skills/*.json dist/spec/SHA256SUMS

      # Runs after the build so scanner output cannot dirty the tree the builder checks.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release notes
        run: |
          {
            echo "Commit: $GITHUB_SHA"
            echo "Tag: $GITHUB_REF_NAME"
            echo "Plugin version: ${GITHUB_REF_NAME#v}"
            echo
            echo '```'
            cat dist/spec/SHA256SUMS
            echo '```'
          } > release-notes.md

      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/spec/catalog.json \
            dist/spec/skills/*.json \
            dist/spec/SHA256SUMS
